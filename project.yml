name: Opal
options:
  bundleIdPrefix: com.jamielesouef
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  OpalKit:
    path: Modules/OpalKit
targets:
  Opal:
    type: application
    platform: macOS
    sources:
      - path: App/Opal
      - path: Icon/AppIcon.icon
    dependencies:
      - package: OpalKit
        product: OpalCore
      - package: OpalKit
        product: OpalDesign
    entitlements:
      path: App/Opal/Opal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: App/Opal/Info.plist
      properties:
        CFBundleDisplayName: Opal
        CFBundleName: Opal
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Jamie Le Souef"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.Opal
        PRODUCT_NAME: Opal
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Opal:
    build:
      targets:
        Opal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OpalKit/OpalCoreTests
        - package: OpalKit/OpalDesignTests
  Opal Release:
    build:
      targets:
        Opal: all
    run:
      config: Release
      debugEnabled: false
      disableMainThreadChecker: true
    profile:
      config: Release
    archive:
      config: Release
